name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      # ---------------- THEMES ----------------
      - name: Deploy themes
        run: |
          rsync -avz --delete \
            --no-owner --no-group \
            wp-content/themes/ \
            ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:${{ secrets.STAGING_PATH }}/wp-content/themes/

      # ---------------- OLD ENERGDIVE PLUGINS ----------------
      - name: Deploy energdive-* plugins (if exist)
        run: |
          if ls wp-content/plugins/energdive-* 1> /dev/null 2>&1; then
            rsync -avz --delete \
              --no-owner --no-group \
              wp-content/plugins/energdive-*/ \
              ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:${{ secrets.STAGING_PATH }}/wp-content/plugins/
          else
            echo "No energdive-* plugins found. Skipping."
          fi

      # ---------------- ENERG MEMBERS (MAIN) ----------------
      - name: Deploy energ-members plugin
        run: |
          rsync -avz --delete \
            --no-owner --no-group \
            wp-content/plugins/energ-members/ \
            ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:${{ secrets.STAGING_PATH }}/wp-content/plugins/energ-members/
